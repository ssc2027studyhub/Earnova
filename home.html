<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #2563eb);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            background: white;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #111827;
        }

        .login-box .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Welcome 👋</h1>
        <p class="subtitle">Login to your account</p>

        <form onsubmit="login(event)">

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        function login(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            /*
             * Demo login:
             * Email: admin@gmail.com
             * Password: 123456
             */

            if (email === "admin@gmail.com" && password === "123456") {
                message.style.color = "green";
                message.textContent = "Login successful! ✅";

                // এখানে পরে dashboard page-এ পাঠানো যাবে
                // window.location.href = "dashboard.html";

            } else {
                message.style.color = "red";
                message.textContent = "Email অথবা Password ভুল! ❌";
            }
        }
    </script>

</body>
</html>
