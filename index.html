<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnova Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      font-size: 35px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 18px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 15px;
      font-size: 18px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      color: white;
      background: #2563eb;
      cursor: pointer;
      margin-bottom: 15px;
    }

    button.create {
      background: #16a34a;
    }

    button:active {
      opacity: 0.8;
    }

    p {
      text-align: center;
      font-size: 18px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">Earnova</div>

    <h2>Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <p>Don't have an account?</p>

    <button class="create" onclick="createAccount()">
      Create Account
    </button>

  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script>

    // =========================
    // YOUR FIREBASE CONFIG
    // =========================

    const firebaseConfig = {
  apiKey: "AIzaSyBH4xPbZhbBgJbvs827ILtyOozFt8F4FDY",
  authDomain: "earnova-24492.firebaseapp.com",
  projectId: "earnova-24492",
  storageBucket: "earnova-24492.firebasestorage.app",
  messagingSenderId: "942334786240",
  appId: "1:942334786240:web:09c3661aac41f8d4474b25",
  measurementId: "G-H5KPFEK6E6"
};

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();


    // =========================
    // CREATE ACCOUNT
    // =========================

    function createAccount() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (email === "" || password === "") {
        alert("Please enter email and password.");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
      }

      auth.createUserWithEmailAndPassword(email, password)
        .then(function(userCredential) {

          alert("Account created successfully!");

          window.location.href = "home.html";

        })
        .catch(function(error) {

          alert(error.message);

        });
    }


    // =========================
    // LOGIN
    // =========================

    function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (email === "" || password === "") {
        alert("Please enter email and password.");
        return;
      }

      auth.signInWithEmailAndPassword(email, password)
        .then(function(userCredential) {

          alert("Login successful!");

          window.location.href = "home.html";

        })
        .catch(function(error) {

          alert(error.message);

        });
    }

  </script>

</body>
</html>
